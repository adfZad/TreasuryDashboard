<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Treasury Dashboard | 15 Aug 2026</title>
  <style>
:root {
  --bg: #f5f7fb;
  --surface: #ffffff;
  --text: #182235;
  --muted: #68758b;
  --line: #dfe5ef;
  --navy: #163a63;
  --blue: #2e6eb5;
  --blue-soft: #eaf2fb;
  --green: #21895a;
  --green-soft: #e9f7f0;
  --red: #c84949;
  --red-soft: #fbecec;
  --amber: #b47b15;
  --amber-soft: #fff5df;
  --shadow: 0 10px 30px rgba(27, 48, 80, .08);
  --radius: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif; color: var(--text); background: var(--bg); }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
.app-shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; background: #102d4e; color: white; padding: 22px 16px 18px; display: flex; flex-direction: column; z-index: 20; }
.brand { display: flex; gap: 12px; align-items: center; padding: 0 8px 22px; border-bottom: 1px solid rgba(255,255,255,.12); }
.brand-mark { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: #5b92ce; font-weight: 800; font-size: 22px; }
.brand-title { font-weight: 800; font-size: 18px; letter-spacing: .2px; }
.brand-subtitle { font-size: 12px; color: #b9c9db; margin-top: 2px; }
.nav { padding: 18px 0; display: grid; gap: 5px; }
.nav-item { appearance: none; border: 0; background: transparent; color: #d7e1ec; text-align: left; padding: 11px 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; font-weight: 650; }
.nav-item span { width: 20px; opacity: .9; }
.nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
.nav-item.active { background: #e9f2fc; color: #143d68; }
.sidebar-footer { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid rgba(255,255,255,.12); }
.small-label { font-size: 10px; text-transform: uppercase; letter-spacing: .9px; color: #91a8bf; }
.source-name { font-size: 12px; line-height: 1.35; color: #d4dfeb; margin-top: 5px; }
.offline-pill { margin-top: 12px; display: inline-block; font-size: 11px; color: #d5f5e7; background: rgba(39,145,94,.28); padding: 6px 9px; border-radius: 99px; }
.main { min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 15; min-height: 86px; display: flex; align-items: center; gap: 18px; justify-content: space-between; padding: 16px 26px; background: rgba(245,247,251,.94); backdrop-filter: blur(10px); border-bottom: 1px solid #e7ebf2; }
.topbar h1 { font-size: 22px; margin: 0 0 4px; }
.topbar p { margin: 0; color: var(--muted); font-size: 13px; }
.top-actions { display: flex; align-items: end; gap: 10px; }
.role-select-wrap { display: grid; gap: 4px; font-size: 11px; color: var(--muted); font-weight: 700; }
select, input, textarea { border: 1px solid #cfd7e3; background: white; border-radius: 9px; padding: 9px 10px; color: var(--text); outline: none; }
select:focus, input:focus, textarea:focus { border-color: #6e9dd2; box-shadow: 0 0 0 3px #e3effc; }
.secondary-btn, .primary-btn, .danger-btn, .icon-btn { border: 0; border-radius: 9px; padding: 10px 13px; font-weight: 750; }
.secondary-btn { color: #214c78; background: #e8f1fb; }
.primary-btn { color: #fff; background: #2367ab; }
.danger-btn { color: #9a3434; background: #fbe6e6; }
.icon-btn { background: #e8eef6; color: #183e67; padding: 9px 11px; }
.mobile-only { display: none; }
.content { padding: 22px 26px 44px; max-width: 1600px; margin: 0 auto; }
.kpi-grid { display: grid; grid-template-columns: repeat(6, minmax(160px, 1fr)); gap: 14px; margin-bottom: 16px; }
.kpi-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; min-height: 122px; }
.kpi-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.kpi-label { font-size: 12px; color: var(--muted); font-weight: 700; }
.kpi-icon { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; background: var(--blue-soft); color: var(--blue); }
.kpi-value { font-size: 26px; font-weight: 850; margin-top: 10px; letter-spacing: -.5px; }
.kpi-foot { font-size: 11px; color: var(--muted); margin-top: 3px; }
.good { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--amber); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 17px; min-width: 0; }
.card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-title { font-weight: 800; font-size: 15px; }
.card-subtitle { color: var(--muted); font-size: 11px; margin-top: 3px; }
.badge { padding: 5px 8px; border-radius: 999px; font-size: 10px; font-weight: 800; white-space: nowrap; }
.badge.blue { background: var(--blue-soft); color: var(--blue); }
.badge.green { background: var(--green-soft); color: var(--green); }
.badge.amber { background: var(--amber-soft); color: var(--amber); }
.badge.red { background: var(--red-soft); color: var(--red); }
.chart { min-height: 245px; width: 100%; overflow: hidden; }
.chart svg { width: 100%; height: 100%; display: block; }
.chart-legend { display: flex; gap: 15px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 6px; }
.legend-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; }
.table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; min-width: 600px; }
th, td { text-align: left; padding: 10px 11px; border-bottom: 1px solid #edf0f4; font-size: 12px; vertical-align: top; }
th { position: sticky; top: 0; background: #f6f8fb; color: #526176; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.progress { height: 7px; background: #edf1f5; border-radius: 99px; overflow: hidden; min-width: 90px; }
.progress > span { display: block; height: 100%; background: #3778bb; border-radius: inherit; }
.section-heading { margin: 8px 0 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.section-heading h2 { margin: 0; font-size: 18px; }
.section-heading p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
.note-box { border: 1px solid #dbe3ee; border-left: 4px solid #4e83bb; border-radius: 10px; padding: 12px 13px; font-size: 12px; color: #4d5e72; background: #f8fbff; line-height: 1.5; }
.alert-box { border-left-color: #c88923; background: #fffaf0; }
.metric-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #edf0f4; }
.metric-row:last-child { border-bottom: 0; }
.metric-name { font-size: 12px; color: #56667b; }
.metric-value { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.ratio-card { display: grid; grid-template-columns: 110px 1fr; gap: 15px; align-items: center; }
.ratio-big { width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(#3479bd var(--pct), #e9eef4 0); position: relative; }
.ratio-big::before { content: ''; position: absolute; inset: 13px; border-radius: 50%; background: white; }
.ratio-big span { position: relative; font-weight: 850; font-size: 20px; }
.workflow-grid { display: grid; gap: 12px; }
.workflow-item { border: 1px solid var(--line); border-radius: 13px; padding: 14px; background: white; }
.workflow-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.workflow-section { font-weight: 800; }
.stage-track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin-top: 12px; }
.stage { border-radius: 8px; padding: 8px; text-align: center; font-size: 10px; background: #eef2f6; color: #657287; border: 1px solid #e2e7ed; }
.stage.done { background: #e8f6ef; color: #237b54; border-color: #cbe9d9; }
.stage.current { background: #e9f2fc; color: #245f9b; border-color: #cbdff5; }
.comment-list { margin-top: 12px; display: grid; gap: 7px; }
.comment { padding: 9px 10px; border-radius: 9px; background: #f7f9fb; font-size: 11px; color: #4a596b; }
.comment strong { color: #26394e; }
.comment-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; }
.comment-form textarea { min-height: 42px; resize: vertical; }
.input-panel { display: grid; gap: 16px; }
.editable-table input { width: 100%; min-width: 90px; text-align: right; padding: 7px 8px; }
.toolbar { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 14px; }
.file-label { display: inline-flex; align-items: center; background: #e8f1fb; color: #214c78; padding: 10px 13px; border-radius: 9px; font-weight: 750; cursor: pointer; }
.file-label input { display: none; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.toast { position: fixed; right: 22px; bottom: 22px; background: #183b63; color: white; padding: 11px 14px; border-radius: 10px; box-shadow: var(--shadow); opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s; z-index: 50; font-size: 12px; }
.toast.show { opacity: 1; transform: translateY(0); }
@media (max-width: 1250px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 980px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: -270px; transition: .2s; width: 260px; }
  .sidebar.open { left: 0; box-shadow: 20px 0 50px rgba(0,0,0,.25); }
  .mobile-only { display: inline-block; }
  .topbar { padding: 14px 16px; }
  .content { padding: 18px 16px 40px; }
  .top-actions { margin-left: auto; }
  .role-select-wrap { display: none; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}
@media (max-width: 650px) {
  .kpi-grid { grid-template-columns: 1fr 1fr; }
  .kpi-value { font-size: 22px; }
  .secondary-btn { display: none; }
  .topbar h1 { font-size: 18px; }
  .stage-track { grid-template-columns: 1fr; }
  .comment-form { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">T</div>
        <div>
          <div class="brand-title">Treasury</div>
          <div class="brand-subtitle">Offline Dashboard</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span> Executive Dashboard</button>
        <button class="nav-item" data-view="funds"><span>▣</span> Funds Position</button>
        <button class="nav-item" data-view="cashflow"><span>↕</span> Cash Flow</button>
        <button class="nav-item" data-view="workingcapital"><span>◫</span> Working Capital</button>
        <button class="nav-item" data-view="loans"><span>▤</span> Loans</button>
        <button class="nav-item" data-view="debt"><span>◎</span> Debt & Liquidity</button>
        <button class="nav-item" data-view="movement"><span>⌁</span> Loan Movement</button>
        <button class="nav-item" data-view="workflow"><span>✓</span> Comments & Approval</button>
        <button class="nav-item" data-view="data"><span>✎</span> Data Input</button>
      </nav>
      <div class="sidebar-footer">
        <div class="small-label">Source workbook</div>
        <div class="source-name">Treasury report as on 15Aug2026.xlsx</div>
        <div class="offline-pill">● Offline ready</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Menu">☰</button>
        <div>
          <h1 id="pageTitle">Executive Treasury Dashboard</h1>
          <p id="pageSubtitle">Position as on 15 August 2026 · Amounts in QAR million unless stated</p>
        </div>
        <div class="top-actions">
          <label class="role-select-wrap">Role
            <select id="roleSelect">
              <option>BU Data Entry</option>
              <option>BU Finance Head</option>
              <option>Business Head</option>
              <option>Corporate Finance</option>
              <option>CFO</option>
              <option>CEO / Board</option>
            </select>
          </label>
          <button class="secondary-btn" id="exportBtn">Export Data</button>
        </div>
      </header>

      <div class="content" id="content"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script>
const BASELINE = {
  meta: { reportDate: '15 August 2026', source: 'Treasury report as on 15Aug2026.xlsx', unit: 'QAR million' },
  funds: {
    totalBankBalance: 7.095650211,
    liquidityReserve: 5,
    reservedWorkingCapital: 2,
    qarByUnit: [
      { name: 'ZAD', amount: 5.026102447 }, { name: 'QFI', amount: 0.39374425 },
      { name: 'USB', amount: 0.40519557 }, { name: 'ACC', amount: 0.0671057 }, { name: 'GUC', amount: 0.833549 }
    ],
    qarByBank: [
      { name: 'Doha', amount: 2.877749 }, { name: 'Dukhan', amount: 1.07799227 },
      { name: 'Al Rayan', amount: 0.428426 }, { name: 'Mashreq', amount: 0.683919147 },
      { name: 'QIB', amount: 0.034557 }, { name: 'HSBC', amount: 0.032419 }, { name: 'UBS', amount: 0.0276655 }
    ],
    usdAccountsByBank: [
      { name: 'Dukhan', amount: 0.44144756 }, { name: 'Mashreq', amount: 0.00694278 },

    ]
  },
  cashflow: [
    { month: 'Aug', inflow: 100, outflow: 90 },
    { month: 'Sep', inflow: 120, outflow: 120 },
    { month: 'Oct', inflow: 140, outflow: 145 }
  ],
  workingCapital: [
    { bank: 'Qatar Islamic Bank', short: 'QIB', sanctioned: 50, utilised: 3.715629365, lc: 0.000043365, murabaha: 0, bg: 3.715586 },
    { bank: 'Mashreq Al Islami', short: 'Mashreq', sanctioned: 85, utilised: 70, lc: 0, murabaha: 70, bg: 0 },
    { bank: 'Al Rayan', short: 'Al Rayan', sanctioned: 145, utilised: 19, lc: 15, murabaha: 2, bg: 2 },
    { bank: 'Dukhan Bank', short: 'Dukhan', sanctioned: 160, utilised: 125, lc: 100, murabaha: 10, bg: 15 },
    { bank: 'UBS', short: 'UBS', sanctioned: 15, utilised: 15, lc: 0, murabaha: 15, bg: 0 }
  ],
  regionFacilities: [
    { region: 'Qatar', sanctioned: 355, utilised: 148.000043365 },
    { region: 'U.A.E', sanctioned: 85, utilised: 70 },
    { region: 'Switzerland', sanctioned: 15, utilised: 15 }
  ],
  loans: {
    shortTerm: 115, longTerm: 494,
    byBank: [
      { bank: 'Dukhan Bank', stl: 10, ltl: 217 },
      { bank: 'Mashreq Al Islami', stl: 70, ltl: 217 },
      { bank: 'UBS', stl: 25, ltl: 60 },
      { bank: 'Al Rayan', stl: 10, ltl: 0 }
    ],
    shortRepayment: [ { period: 'Aug-26', amount: 4 }, { period: 'Sep-26', amount: 2 }, { period: 'Oct-26', amount: 2 } ],
    longRepayment: [
      { period: 'Q3-2026 rem.', amount: 1.848282161 }, { period: 'Q4-2026', amount: 4.627757161 },
      { period: 'Q1-2027', amount: 4.366782161 }, { period: 'Q2-2027', amount: 4.627757161 },
      { period: 'Q3-2027', amount: 5.351967346 }, { period: 'Q4-2027', amount: 5.612942346 }
    ]
  },
  movement: [
    { date: '01-Aug-26', loans: 609, liquidityReserve: 10 },
    { date: '01-Sep-26', loans: 679.8313253012, liquidityReserve: 10 },
    { date: '01-Oct-26', loans: 604.6703923024, liquidityReserve: 10 },
    { date: '01-Nov-26', loans: 595.3259176036, liquidityReserve: 10 },
    { date: 'Projected', loans: 564.1572429048, liquidityReserve: 10 }
  ],
  debt: {
    equityBookValue: 950,
    investmentCostShares: 200,
    investmentCostMetal: 250,
    investmentMarketShares: 500,
    investmentMarketMetal: 7.58292703515,
    historical: [
      { period: '2023', debt: 100, liquidAssets: 525 }, { period: '2024', debt: 200, liquidAssets: 510 },
      { period: '2025', debt: 300, liquidAssets: 560 }, { period: 'Jun-26', debt: 400, liquidAssets: 395 }
    ],
    marketHistorical: [
      { period: '2023', debt: 525, liquidAssets: 549.5 }, { period: '2024', debt: 525, liquidAssets: 533 },
      { period: '2025', debt: 682.4, liquidAssets: 585 }, { period: 'Jun-26', debt: 1173.9, liquidAssets: 412.5 }
    ]
  },
  workflow: {
    'Funds Position': { stage: 2, comments: [{ role: 'BU Finance Head', text: 'Bank balances reviewed against available statements.' }] },
    'Cash Flow': { stage: 2, comments: [{ role: 'BU Finance Head', text: 'August to October projection updated.' }] },
    'Working Capital': { stage: 3, comments: [{ role: 'Business Head', text: 'Facility utilisation reviewed. Monitor high utilisation at UBS and Mashreq.' }] },
    'Loans': { stage: 3, comments: [{ role: 'Corporate Finance', text: 'Repayment profile requires continued monitoring for Q4 2026.' }] },
    'Debt & Liquidity': { stage: 1, comments: [{ role: 'BU Data Entry', text: 'Current ratios recalculated in the web app because the source workbook contains broken references in this section.' }] },
    'Loan Movement': { stage: 1, comments: [] }
  }
};

const STAGES = ['BU Data Entry', 'BU Finance Head', 'Business Head', 'Corporate Finance', 'CFO'];
const STORAGE_KEY = 'treasury_offline_dashboard_v1';
let state = loadState();
let currentView = 'dashboard';
let currentRole = 'BU Data Entry';

function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }
function loadState() {
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : deepClone(BASELINE); }
  catch { return deepClone(BASELINE); }
}
function saveState(msg = 'Saved locally') { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); toast(msg); }
function fmt(n, d = 2) { return Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d }); }
function pct(n, d = 1) { return `${fmt(n * 100, d)}%`; }
function sum(arr, key) { return arr.reduce((a, x) => a + Number(key ? x[key] : x), 0); }
function totalLoans() { return Number(state.loans.shortTerm) + Number(state.loans.longTerm); }
function fundsAvailable() { return Number(state.funds.totalBankBalance) - Number(state.funds.liquidityReserve) - Number(state.funds.reservedWorkingCapital); }
function wcTotals() { return { sanctioned: sum(state.workingCapital, 'sanctioned'), utilised: sum(state.workingCapital, 'utilised') }; }
function currentRatios() {
  const debt = totalLoans();
  const cash = Number(state.funds.totalBankBalance);
  const costAssets = cash + Number(state.debt.investmentCostShares) + Number(state.debt.investmentCostMetal);
  const marketAssets = cash + Number(state.debt.investmentMarketShares) + Number(state.debt.investmentMarketMetal);
  return { de: debt / Number(state.debt.equityBookValue), cost: costAssets / debt, market: marketAssets / debt, costAssets, marketAssets };
}

function toast(message) {
  const el = document.getElementById('toast'); el.textContent = message; el.classList.add('show');
  clearTimeout(window.__toastTimer); window.__toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function kpi(label, value, foot, icon, cls = '') {
  return `<div class="kpi-card"><div class="kpi-top"><div class="kpi-label">${label}</div><div class="kpi-icon">${icon}</div></div><div class="kpi-value ${cls}">${value}</div><div class="kpi-foot">${foot}</div></div>`;
}
function card(title, subtitle, body, badge = '') {
  return `<section class="card"><div class="card-header"><div><div class="card-title">${title}</div><div class="card-subtitle">${subtitle || ''}</div></div>${badge}</div>${body}</section>`;
}
function svgBarChart(items, valueKey, opts = {}) {
  const W = 720, H = opts.height || 260, m = { l: 105, r: 35, t: 18, b: 38 };
  const max = Math.max(...items.map(x => Number(x[valueKey]) || 0), 1) * 1.12;
  const plotW = W - m.l - m.r, plotH = H - m.t - m.b, step = plotH / items.length, bh = Math.min(24, step * .55);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (let i=0;i<=4;i++) { const x=m.l+plotW*i/4; const v=max*i/4; s += `<line x1="${x}" y1="${m.t}" x2="${x}" y2="${H-m.b}" stroke="#e7ecf2"/><text x="${x}" y="${H-12}" text-anchor="middle" fill="#7a8798" font-size="10">${fmt(v, opts.decimals ?? 1)}</text>`; }
  items.forEach((it,i)=>{ const y=m.t+step*i+step/2; const w=(Number(it[valueKey])||0)/max*plotW; s += `<text x="${m.l-10}" y="${y+4}" text-anchor="end" fill="#516176" font-size="11">${it.name || it.bank || it.region || it.period}</text><rect x="${m.l}" y="${y-bh/2}" width="${w}" height="${bh}" rx="4" fill="#397bbd"/><text x="${m.l+w+7}" y="${y+4}" fill="#31465f" font-size="10" font-weight="700">${fmt(it[valueKey], opts.decimals ?? 2)}</text>`; });
  return s + `</svg>`;
}
function svgGroupedBar(items, keys, labels, opts = {}) {
  const W=720,H=opts.height||270,m={l:55,r:22,t:18,b:48}; const vals=items.flatMap(x=>keys.map(k=>Number(x[k])||0)); const max=Math.max(...vals,1)*1.15;
  const plotW=W-m.l-m.r,plotH=H-m.t-m.b,groupW=plotW/items.length,bw=Math.min(26,groupW/(keys.length+1)); const colors=['#3479bd','#dc6b61','#6caa52','#8d6fba']; let s=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=4;i++){const y=m.t+plotH-i*plotH/4; const v=max*i/4; s+=`<line x1="${m.l}" y1="${y}" x2="${W-m.r}" y2="${y}" stroke="#e7ecf2"/><text x="${m.l-8}" y="${y+4}" text-anchor="end" fill="#7a8798" font-size="10">${fmt(v,0)}</text>`;}
  items.forEach((it,i)=>{const cx=m.l+groupW*i+groupW/2; keys.forEach((k,j)=>{const v=Number(it[k])||0,h=v/max*plotH,x=cx+(j-(keys.length-1)/2)*bw-bw*.42; s+=`<rect x="${x}" y="${m.t+plotH-h}" width="${bw*.84}" height="${h}" rx="3" fill="${colors[j]}"/>`;}); s+=`<text x="${cx}" y="${H-17}" text-anchor="middle" fill="#5d6b7e" font-size="10">${it.short || it.region || it.month || it.period || it.bank}</text>`;});
  s+=`</svg><div class="chart-legend">${labels.map((l,i)=>`<span><i class="legend-dot" style="background:${colors[i]}"></i>${l}</span>`).join('')}</div>`; return s;
}
function svgLineChart(items, valueKey, opts={}) {
  const W=720,H=opts.height||250,m={l:48,r:30,t:24,b:45}; const vals=items.map(x=>Number(x[valueKey])||0); let min=Math.min(...vals),max=Math.max(...vals); if(min===max){min=0;max=Math.max(1,max);} const pad=(max-min)*.15||1; min=Math.min(0,min-pad); max=max+pad;
  const pw=W-m.l-m.r,ph=H-m.t-m.b; const x=i=>m.l+(items.length===1?pw/2:i*pw/(items.length-1)); const y=v=>m.t+(max-v)/(max-min)*ph; let s=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=4;i++){const yy=m.t+ph*i/4,v=max-(max-min)*i/4; s+=`<line x1="${m.l}" y1="${yy}" x2="${W-m.r}" y2="${yy}" stroke="#e7ecf2"/><text x="${m.l-7}" y="${yy+4}" text-anchor="end" fill="#7a8798" font-size="10">${fmt(v,1)}</text>`;}
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' '); s+=`<polyline points="${pts}" fill="none" stroke="#3276b8" stroke-width="3" stroke-linejoin="round"/>`;
  vals.forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="#fff" stroke="#3276b8" stroke-width="3"/><text x="${x(i)}" y="${y(v)-10}" text-anchor="middle" fill="#29445f" font-size="10" font-weight="700">${fmt(v,2)}</text><text x="${x(i)}" y="${H-16}" text-anchor="middle" fill="#637083" font-size="10">${items[i].period||items[i].month||items[i].date}</text>`;}); return s+`</svg>`;
}
function donut(value, max, centerText) { const p=Math.max(0,Math.min(1,value/max))*100; return `<div class="ratio-big" style="--pct:${p}%"><span>${centerText}</span></div>`; }

function render(){
  const map={dashboard:dashboardView,funds:fundsView,cashflow:cashflowView,workingcapital:workingCapitalView,loans:loansView,debt:debtView,movement:movementView,workflow:workflowView,data:dataView};
  document.getElementById('content').innerHTML=map[currentView](); const [t,s]=viewMeta[currentView]; document.getElementById('pageTitle').textContent=t; document.getElementById('pageSubtitle').textContent=s;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView));
}

document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('.nav-item'); if(!b)return; currentView=b.dataset.view; document.getElementById('sidebar').classList.remove('open'); render();});
document.getElementById('roleSelect').addEventListener('change',e=>{currentRole=e.target.value; if(currentView==='workflow')render();});
document.getElementById('exportBtn').addEventListener('click',exportData);
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
render();

</script>
</body>
</html>
